name: Collect weather forecasts

on:
  schedule:
    # GitHub cron uses UTC. 22:00 UTC is 07:00 KST on the following day.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Collect forecasts
        run: python collect_weather.py

      - name: Commit updated CSV files
        shell: bash
        run: |
          git add data

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update weather forecast $(TZ=Asia/Seoul date +%F)"
          git push
